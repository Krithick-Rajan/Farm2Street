services:
  # ----------------------------------------------------------------------------
  # 1. Full-Stack Web Service (Apache Tomcat 11 + Servlets + JSP + React)
  # ----------------------------------------------------------------------------
  - type: web
    name: farm2street-fullstack
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: SUPABASE_DB_URL
        value: jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: SUPABASE_DB_USER
        value: postgres.aydjkpolejhsmpsrmgfo
      - key: SUPABASE_DB_PASS
        value: KRITHICK@007
      - key: RAZORPAY_SECRET
        value: test_secret_key

  # ----------------------------------------------------------------------------
  # 2. High-Performance Static Site (React 19 + Vite Global Edge CDN)
  # ----------------------------------------------------------------------------
  - type: web
    name: farm2street-web
    runtime: static
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
