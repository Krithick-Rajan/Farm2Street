# Supabase PostgreSQL Cloud Database Configuration (JDBC)
# Replace host, user, and password with your Supabase Database credentials
# Supabase Settings -> Database -> Connection string (JDBC/Direct Connection)

db.driver=org.postgresql.Driver
db.url=jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require
db.username=postgres.your_project_ref
db.password=your_supabase_password

# Fallback local PostgreSQL / SQLite configuration if offline
db.fallback.url=jdbc:postgresql://localhost:5432/farm2street_db
db.fallback.username=postgres
db.fallback.password=postgres
